<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja VIP</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('https://i.ibb.co/DP0P2DQr/20250920-akaza-ovicio-555x555.jpg') no-repeat center center fixed;
    background-size: cover;
    color: white;
    text-align: center;
}

.container {
    background: rgba(0,0,0,0.7);
    min-height: 100vh;
    padding: 20px;
}

h1 {
    margin-bottom: 30px;
}
h2 {
    margin-bottom: 10px;
}
h1 {
padding: 1px;
border-radius: 30px;
color:blue

}
h2 {
padding: 1px;
border-radius: 15px;
color:green

}

.menu, .submenu {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

button {
    padding: 20px;
    font-size: 20px;
    border: none;
    border-radius: 15px;
    background: #A020F0;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #A020F0;
}

.voltar {
    background: red;
}
</style>
</head>

<body>

<div class="container">

<h1>🔥 Loja Oficial GEAN 🔥</h1>
<h2> criado por 98 98166 6909</h2>

<div id="main" class="menu">
    <button onclick="abrir('golds')">💰 Golds</button>
    <button onclick="abrir('carros')">🚗 Carros Pagos</button>
    <button onclick="abrir('contas')">👤 Contas</button>
    <button onclick="abrir('servicos')">⚙️ Serviços</button>
    <button onclick="abrir('plot')">🚕carros plot</button>
    <button onclick="abrir('combo')">combo</button>
</div>

<div id="golds" class="submenu" style="display:none;">
    <button onclick="comprar('10k Golds - R$1')">10k = R$1</button>
    <button onclick="comprar('20k Golds - R$2')">20k = R$2</button>
    <button onclick="comprar('30k Golds - R$3')">30k = R$3</button>
    <button onclick="comprar('40k Golds - R$4')">40k = R$4</button>
    <button onclick="comprar('50k Golds - R$5')">50k = R$5</button>
    <button onclick="comprar('60k Golds - R$6')">60k = R$6</button>
    <button onclick="comprar('250k Golds - R$7')">250k = R$7</button>
    <button onclick="comprar('500k Golds - R$8')">500k = R$8</button>
    <button class="voltar" onclick="voltar()">⬅ Voltar</button>
</div>

<div id="carros" class="submenu" style="display:none;">
    <button onclick="comprar('Motorhome  R$3')">Motorhome plot= R$3,00</button>
    <button onclick="comprar('SW4  R$3')">SW4 plot = R$3,00</button>
    <button onclick="comprar('Jeep Gallard R$3')">Jeep Gallard = R$3,00</button>
    <button onclick="comprar('La Ferrari R$3')">La Ferrari = R$3,00</button>
    <button onclick="comprar('F650 R$3')">F650 = R$3,00</button>
    <button class="voltar" onclick="voltar()">⬅ Voltar</button>
</div>

<div id="contas" class="submenu" style="display:none;">
    <button onclick="comprar('Conta 1: W16, Smook, 178 carros, 50M money, 30k golds - R$5')">
        Conta 1<br>W16, Smook, 178 carros, 50M, 30k Golds<br>R$5
    </button>

    <button onclick="comprar('Conta 2: Completa com W16, Smook, 30 plots, King Rank, 50M, carros raros - R$15')">
        Conta 2<br>Completa + King Rank + carros raros<br>R$12
    </button>

    <button class="voltar" onclick="voltar()">⬅ Voltar</button>
</div>

<div id="servicos" class="submenu" style="display:none;">
    <button onclick="comprar('King Rank R$5,00')">King Rank = R$5,00</button>
    <button class="voltar" onclick="voltar()">⬅ Voltar</button>
</div>

<div id="plot" class="submenu" style="display:none;">
    <button onclick="comprar('plot R$1,00')">carro plot = R$1,00</button>
    <button class="voltar" onclick="voltar()">⬅ Voltar</button>
</div>

<div id="combo" class="submenu" style="display:none;">
    <button onclick="comprar('combo R$7,00')">carro raro, vc escolhe um dos 4, king, 30k de golds= R$7,00</button>
    <button class="voltar" onclick="voltar()">⬅ Voltar</button>
</div>

</div>

<script>
function abrir(menu) {
    document.getElementById("main").style.display = "none";
    document.getElementById(menu).style.display = "flex";
}

function voltar() {
    let menus = document.querySelectorAll(".submenu");
    menus.forEach(m => m.style.display = "none");
    document.getElementById("main").style.display = "flex";
}

function comprar(item) {
    let numero = "5598981666909";
    let mensagem = encodeURIComponent("Olá, eu vou querer " + item + ", como funciona?");
    window.open("https://wa.me/" + numero + "?text=" + mensagem);
}
</script>

</body>
</html>
