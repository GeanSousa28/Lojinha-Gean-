#totalCarrinho{

.comprarTudo{

.limparCarrinho{

.removerBtn{

.exemploFoto{

#zoomOverlay{
    display:none;

#zoomOverlay img{

/* 🔥 CARRINHO FLUTUANTE */
#carrinhoFlutuante{

    right:20px;
    background:#00ff88;
    color:black;
    padding:15px 18px;
    border-radius:50px;

    cursor:pointer;
    box-shadow:0 0 15px rgba(0,255,136,0.5);

/* 🔥 POPUP CARRINHO */
#carrinhoPopup{
    position:fixed;
    bottom:90px;
    right:20px;
    width:320px;
    max-height:420px;
    overflow:auto;
    background:rgba(0,0,0,0.95);
    border:2px solid #00ff88;
    border-radius:20px;
    padding:15px;
    z-index:999999;
    display:none;
    box-shadow:0 0 20px rgba(0,255,136,0.4);
}

#listaFeedbacks div{
    background:#222;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    text-align:left;
}

</style>
</head>

<div class="exemploFoto" onclick="abrirZoom('https://i.ibb.co/yFSLCKqB/IMG-20260514-235652.png')">
    <img src="https://i.ibb.co/yFSLCKqB/IMG-20260514-235652.png"

style="width:100%;padding:15px;border-radius:15px;font-size:18px;">
<option value="">⭐ Escolha as estrelas</option>

<option value="2">⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="5">⭐⭐⭐⭐⭐</option>
</select>

<br><br>

<textarea id="textoFeedback"
placeholder="Só clientes que compraram podem avaliar..."
style="width:100%;height:120px;border-radius:15px;padding:10px;"></textarea>

<br><br>

Enviar feedback

</div>

</div>

<!-- 🔥 CARRINHO FLUTUANTE -->
<div id="carrinhoFlutuante" onclick="toggleCarrinho()">
🛒 <span id="contador">0</span>
</div>

<!-- 🔥 POPUP DO CARRINHO -->
<div id="carrinhoPopup">

<h2>🛒 Seu Carrinho</h2>

<div id="listaCarrinho"></div>

<div id="totalCarrinho">Total: R$0</div>

<button class="comprarTudo" onclick="comprarTudo()">
✅ Comprar Tudo
</button>

🗑 Limpar Carrinho
</button>

</div>

    <img id="zoomImg">
</div>

<script>

<!-- COLE ISSO ANTES DO SEU <script> -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
  projectId: "SEU_PROJETO",
  storageBucket: "SEU_PROJETO.appspot.com",
  messagingSenderId: "000000000",
  appId: "APP_ID"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* =========================
   SEU SCRIPT ORIGINAL
========================= */

let carrinho = [];

/* FEEDBACKS ONLINE */
let feedbacks = [];

/* ID ÚNICO */
let userID = localStorage.getItem("userID");

if(!userID){
    userID = crypto.randomUUID();
    localStorage.setItem("userID",userID);
}

/* NOME FIXO */
let nomeUsuario =
localStorage.getItem("nomeUsuario");

/* MENU */
function abrir(menu){

    document.getElementById("main").style.display="none";

    document.getElementById(menu).style.display="flex";

    if(menu==="exemplos"){
        mostrarFeedbacks();
    }
}

function voltar(){

    document.querySelectorAll(".submenu")
    .forEach(m=>{
        m.style.display="none";
    });

    document.getElementById("main").style.display="flex";
}

/* NOME */
if(nomeUsuario){

    document.getElementById("areaNome")
    .style.display="none";

    document.getElementById("nomeSalvo")
    .style.display="block";

    document.getElementById("nomeTexto")
    .innerText = nomeUsuario;

    document.getElementById("idTexto")
    .innerText = userID.slice(0,6);

}

function salvarNome(){

    let nome =
    document.getElementById("nomeInput").value;

    if(nome.trim()==""){
        alert("Digite um nome");
        return;
    }

    localStorage.setItem("nomeUsuario",nome);

    document.getElementById("nomeTexto")
    .innerText = nome;

    document.getElementById("idTexto")
    .innerText = userID.slice(0,6);

    location.reload();
}

/* CARRINHO */
function adicionar(nome,valor){

    carrinho.push({nome,valor});

    atualizar();
}

function atualizar(){

    let lista =
    document.getElementById("listaCarrinho");

    let total =
    document.getElementById("total");

    lista.innerHTML="";

    let soma=0;

    carrinho.forEach((item,index)=>{

        soma += item.valor;

        lista.innerHTML += `
        <div class="itemCarrinho">

        <span>
        ${item.nome} - R$${item.valor}
        </span>

        <button class="removerBtn"
        onclick="remover(${index})">
        ❌
        </button>

        </div>
        `;
    });

    total.innerHTML="Total: R$"+soma;

    document.getElementById("contador")
    .innerText=carrinho.length;
}

function remover(index){

    carrinho.splice(index,1);

    atualizar();
}

function limpar(){

    carrinho=[];

    atualizar();
}

/* COMPRAR */
function comprarTudo(){

    if(carrinho.length==0){
        alert("Carrinho vazio");
        return;
    }

    let numero="556299764298";

    let msg="Olá, quero comprar:%0A%0A";

    let soma=0;

    carrinho.forEach(i=>{

        msg += "- "+i.nome+
        " R$"+i.valor+"%0A";

        soma += i.valor;
    });

    msg += "%0ATotal: R$"+soma;

    window.open(
    "https://wa.me/"+numero+"?text="+msg);

    localStorage.setItem("podeAvaliar","true");
}

/* FEEDBACK */
function enviarFeedback(){

    let podeAvaliar =
    localStorage.getItem("podeAvaliar");

    if(!podeAvaliar){
        alert("Compre algo primeiro");
        return;
    }

    let texto =
    document.getElementById("textoFeedback").value;

    let estrelas =
    document.getElementById("estrelas").value;

    if(texto.trim()==""){
        alert("Digite algo");
        return;
    }

    if(estrelas==""){
        alert("Escolha as estrelas");
        return;
    }

    db.ref("feedbacks").push({

        nome:nomeUsuario,
        id:userID,
        texto:texto,
        estrelas:estrelas,
        data:new Date().toLocaleString()

    });

    localStorage.removeItem("podeAvaliar");

    document.getElementById("textoFeedback").value="";

    mostrarFeedbacks();

    alert("Feedback enviado");
}

/* MOSTRAR FEEDBACKS ONLINE */
function mostrarFeedbacks(){

    let area =
    document.getElementById("listaFeedbacks");

    db.ref("feedbacks").on("value",(snapshot)=>{

        area.innerHTML="";

        let soma=0;
        let total=0;

        let dados = snapshot.val();

        if(!dados){
            return;
        }

        let lista = Object.values(dados).reverse();

        lista.forEach(f=>{

            soma += f.estrelas.length;
            total++;

            area.innerHTML += `

            <div>

            <b>${f.nome}</b>

            <br>

            🆔 ${f.id.slice(0,6)}

            <br><br>

            ${f.estrelas}

            <br><br>

            ${f.texto}

            <br><br>

            <small>${f.data}</small>

            </div>

            `;
        });

        let media = 0;

        if(total>0){
            media = (soma / total).toFixed(1);
        }

        document.getElementById("mediaEstrelas")
        .innerHTML =
        "⭐ Média: "+media+"/5";

    });
}

/* CARRINHO */
function toggleCarrinho(){

    let popup =
    document.getElementById("carrinhoPopup");

    if(popup.classList.contains("ativo")){

        popup.classList.remove("ativo");

    }else{

        popup.classList.add("ativo");
    }
}

/* ZOOM */
function abrirZoom(src){

    document.getElementById("zoomImg").src=src;

    document.getElementById("zoomOverlay")
    .style.display="flex";
}

function fecharZoom(){

    document.getElementById("zoomOverlay")
    .style.display="none";
}

mostrarFeedbacks();

</script>
